name: 訳の誤り
description: 現代語訳の誤りや、よりよい現代語訳を知らせる
title: "[訳] 西国立志編 "
labels: ["訳"]
body:
  - type: input
    id: block
    attributes:
      label: 段落ID
      description: "yaku/ の行頭にある ID（例: saigoku-risshi-hen-000001）"
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: いまの現代語訳
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 直した現代語訳
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 理由・根拠
